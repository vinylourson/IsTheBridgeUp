name: Release

# Fires on a version tag. The tag is the trigger and the source of truth: it
# must match the version in pubspec.yaml, and the job fails if it does not,
# rather than publishing a release whose APKs claim a different version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and publish (e.g. v1.1.0)'
        required: true

env:
  FLUTTER_VERSION: 3.47.1

permissions:
  contents: write

jobs:
  release:
    name: Build signed APKs and publish
    runs-on: ubuntu-latest
    steps:
      # Submodules matter here: .flutter is the SDK this release is built
      # with, pinned so F-Droid can rebuild the same bytes later.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0
          submodules: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Deliberately NOT flutter-action. Releases build with the vendored SDK
      # at .flutter, because F-Droid rebuilds with exactly that revision --
      # a different SDK produces different bytes and the reproducible-build
      # match silently fails.
      - name: Use the vendored Flutter SDK
        run: |
          echo "$GITHUB_WORKSPACE/.flutter/bin" >> "$GITHUB_PATH"
          echo "PUB_CACHE=$GITHUB_WORKSPACE/.pub-cache" >> "$GITHUB_ENV"

      - name: The vendored SDK must match FLUTTER_VERSION
        run: |
          VENDORED=$(git -C .flutter describe --tags)
          echo "vendored: $VENDORED   expected: $FLUTTER_VERSION"
          if [ "$VENDORED" != "$FLUTTER_VERSION" ]; then
            echo "::error::.flutter is $VENDORED but FLUTTER_VERSION is $FLUTTER_VERSION"
            exit 1
          fi

      - run: flutter config --no-analytics && flutter config --android-sdk "$ANDROID_HOME"
      - run: flutter pub get

      # The absolute build path is baked into libapp.so, so it is part of the
      # reproducible-build contract. Recorded here because F-Droid's recipe has
      # to move its checkout to match it.
      - name: Record the build path
        run: echo "Built at $GITHUB_WORKSPACE"

      - name: Tag must match pubspec version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PUBSPEC=$(grep -m1 '^version:' pubspec.yaml | sed 's/version:[[:space:]]*//' | cut -d+ -f1)
          if [ "$TAG" != "v$PUBSPEC" ]; then
            echo "::error::tag $TAG does not match pubspec version $PUBSPEC"
            exit 1
          fi
          echo "version=$PUBSPEC" >> "$GITHUB_ENV"

      - run: flutter analyze
      - run: flutter test --exclude-tags "live,golden"

      - name: Restore the signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is not set; refusing to publish a debug-signed release"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cat > android/key.properties <<PROPS
          storeFile=$RUNNER_TEMP/release.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          PROPS

      # This exact command is mirrored in reproducible.yml and in the F-Droid
      # recipe. GIT_SHA is compiled into libapp.so, so any divergence -- even
      # the abbreviation length -- makes the binaries differ. --short alone
      # scales with repository size and is not stable across clones.
      - name: Build signed APKs
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=GIT_SHA=$(git rev-parse --short=10 HEAD)

      # A debug-signed APK installs fine and is then impossible to upgrade with
      # a real one, so this is checked rather than assumed.
      - name: Refuse anything signed with the debug key
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          for f in build/app/outputs/flutter-apk/app-arm*-release.apk; do
            DN=$("$APKSIGNER" verify --print-certs "$f" | grep -m1 'certificate DN')
            echo "$f -> $DN"
            case "$DN" in
              *"CN=Android Debug"*)
                echo "::error::$f is debug-signed"; exit 1;;
            esac
          done

      - name: Stage the APKs under their released names
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             "dist/is-the-bridge-up-${{ env.version }}-arm64-v8a.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             "dist/is-the-bridge-up-${{ env.version }}-armeabi-v7a.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          cat dist/SHA256SUMS.txt

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          CODE=$(grep -m1 '^version:' pubspec.yaml | sed 's/.*+//')
          NOTES=$(mktemp)
          {
            cat "metadata/en-US/changelogs/$CODE.txt" 2>/dev/null || true
            echo
            echo "### Which APK?"
            echo
            echo "\`arm64-v8a\` for any phone from the last decade. \`armeabi-v7a\` only for older 32-bit devices."
            echo
            echo "Checksums are in \`SHA256SUMS.txt\`. Verify the signer with:"
            echo '```'
            echo "apksigner verify --print-certs <file>.apk"
            echo '```'
          } > "$NOTES"
          gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
            --title "$TAG" --notes-file "$NOTES" --verify-tag
